name: Deploy to Google Cloud
on:
  push:
    branches: [ dev ]  # Ensure you are pushing to the 'dev' branch!

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # THIS IS THE CRITICAL MISSING LINK:
      - name: Configure Docker for Google Cloud
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          docker build -t us-central1-docker.pkg.dev/stock-web-485703/stock-repo/stock-api:latest .
          docker push us-central1-docker.pkg.dev/stock-web-485703/stock-repo/stock-api:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy stock-api \
            --image us-central1-docker.pkg.dev/stock-web-485703/stock-repo/stock-api:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated